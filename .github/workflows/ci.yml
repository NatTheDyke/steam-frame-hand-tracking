name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # the library set of headset/PINS (framenpu 0.4.2, framenpu-cdsp 0.1.2, framehands 0.2.6), by commit
  FRAMENPU: git+https://github.com/NatTheDyke/framenpu@4f2a2b4077872f80b74b77e1c7fc07e779214f90
  FRAMENPU_CDSP: git+https://github.com/NatTheDyke/framenpu-cdsp@5cac3bd0074a498d872fd8452213ec7a9b75c115
  FRAMEHANDS: git+https://github.com/NatTheDyke/framehands@0c1d1c762d5b7acc9d322b106df88b32da94eb7e
  # Mercury's keypoint model from Monado's model repository (no published license: not re-hosted)
  MERCURY_URL: https://gitlab.freedesktop.org/monado/utilities/hand-tracking-models/-/raw/37a8a81bc8f433ac6cbdf2471909d2bac74beca1/grayscale_keypoint_jan18.onnx
  MERCURY_SHA256: 40c0daa598cedb993b54fff17685231b7465d6db342656c401b01c2029efd1d5

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Check the workflow pins match headset/PINS
        run: |
          grep -qx 'framenpu==0.4.2' headset/PINS
          grep -qx 'framenpu-cdsp==0.1.2' headset/PINS
          grep -qx 'framehands==0.2.6' headset/PINS
      - name: Install the pinned libraries
        run: python -m pip install "framenpu[cpu] @ $FRAMENPU" "framenpu-cdsp @ $FRAMENPU_CDSP" "framehands @ $FRAMEHANDS"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: models
          key: mercury-${{ env.MERCURY_SHA256 }}
      - name: Fetch Mercury's keypoint model by hash
        run: |
          mkdir -p models
          [ -f models/jan18.onnx ] || curl -fsSL -o models/jan18.onnx "$MERCURY_URL"
          echo "$MERCURY_SHA256  models/jan18.onnx" | sha256sum -c
          echo "FNPU_MERCURY_MODEL=$PWD/models/jan18.onnx" >> "$GITHUB_ENV"
      - name: Tests
        run: python -m unittest discover -s tests -v
