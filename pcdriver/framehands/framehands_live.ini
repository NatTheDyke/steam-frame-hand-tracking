# framehands live settings: re-read every second by the driver (no SteamVR restart needed).
# Presentation / prediction.  Tuned 2026-11-18 for the 30 Hz tracking-camera source (--source slam):
# linear prediction on, velocity over ~5 samples (150 ms) so it does not amplify jitter.
# Previous (60 Hz passthrough) values: predictLinear = 0, velWindowMs = 50.
predictLinear = 1
predictAngular = 0
maxPredictMs = 50
interpDelayMs = 17
velWindowMs = 150
holdMs = 250
# World-space position smoothing (One Euro; driver protocol v4; 0 = off).  Use this instead of the
# tracker's head-frame pos_filter (tools/profile_slam.conf turns that off): smoothing in the head frame
# makes a still hand follow head turns.
posMinCutoff = 0.8
posBeta = 1.0
maxVelocity = 3.0
maxAngularVelocity = 15.0
maxJumpCm = 15
# Controller handoff (only for hands enabled on the headset panel; loose on purpose)
stillSeconds = 0.8
handAwayCm = 10
stillCm = 2.0
stillDeg = 6
pickupCm = 4.0
pickupDeg = 15
forceHandMode = 0
# Source (set headsetHost = 127.0.0.1 to drive the controllers from tools/replay_sender.py)
headsetHost = 192.168.8.180
port = 47811
statsSeconds = 10
