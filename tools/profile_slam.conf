# Tracker profile for the tracking-camera source (copy to ~/.config/mrhand/profile on the headset).
# Position smoothing happens in the PC driver in world space (posMinCutoff / posBeta in
# framehands_live.ini); every head-frame position smoother is off here, because smoothing (or easing)
# a position in the head frame makes a still hand follow head turns (measured 2026-11-18 with
# pcdriver/tools/pose_recorder: effective head-coupling delay ~300 ms -> 0 ms).
# Pair with the tracker option --blend-ms 0 (headset/start_args).
pos_filter = off
centre_filter = off
send_offset_ms = 0
# Finger curls follow faster than the default (1.0 1.0).
curl_filter = 3.0 3.0
# One view per hand and frame, alternating: half the crops of both views. Both views measured 16% less
# jitter for 4-6 ms more latency and more heat (2026-11-22).
merc_views = alternate
